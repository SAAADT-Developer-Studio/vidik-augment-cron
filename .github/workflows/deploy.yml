name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time. A later run waits; it does not cancel
# an upload that is already in progress.
concurrency:
  group: vidik-augment-cron-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Push and manual runs both publish main. A dispatch from another
    # branch would otherwise ship that ref's wrangler.jsonc crons.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # lockfileVersion 9.0. package.json has no packageManager field.
          # 9.15.9 installs this lockfile with --frozen-lockfile.
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # package.json has no engines field. Wrangler 4.45 requires Node >= 18.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        # The test script is vitest. The repo has no test files yet, so
        # pass when the suite is empty. A real failure still stops the deploy.
        run: pnpm test -- --passWithNoTests

      - name: Deploy
        # `pnpm run deploy` is the package script (`wrangler deploy`).
        # Do not pass --triggers; schedules come from wrangler.jsonc.
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
